[project]
name = "grammar-check"
version = "0.1.0"
description = "High-quality English grammar checking service for HTML strings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "openai>=1.10.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
]
languagetool = [
    "language-tool-python>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N815"]  # Ignore mixedCase variable names in Pydantic models

[tool.black]
line-length = 100
target-version = ["py311"]
