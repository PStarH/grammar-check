[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-check"
version = "0.1.0"
description = "High-quality grammar checker for HTML"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0"
]

[tool.setuptools]
packages = ["app", "eval", "scripts"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
